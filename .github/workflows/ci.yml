name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macOS 15 image: the video exporter uses AVFoundation APIs from the macOS 15 SDK (guarded by
    # #available at runtime, but they must exist at compile time). The app still runs on macOS 14.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: swift build
      - name: Run all test suites
        run: ./scripts/test.sh
